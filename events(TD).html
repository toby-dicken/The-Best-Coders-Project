<!DOCTYPE html>
<html>

<link rel="stylesheet" href="events_style(TD).css">

<head>
    <title>Events</title>
</head>
<body>

<!-- Return Button -->
<div style="text-align:center; margin-bottom: 40px;">
    <a href="main(TD).php" class="return-button">← Back to Homepage</a>
</div>


<h2>Upcoming Events</h2>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>Date (yyyy-mm-dd)</th>
            <th>Title</th>
            <th>Description</th>
        </tr>
    </thead>
    <tbody id="events-table-body">
        <tr><td colspan="4">Loading events...</td></tr>
    </tbody>
</table>




<script>
    
fetch("get_events(TD).php")
    .then(response => response.json())
    .then(events => {
        const tbody = document.getElementById("events-table-body");
        tbody.innerHTML = ""; // clear loading text

        if (events.length === 0) {
            tbody.innerHTML = "<tr><td colspan='4'>No events found</td></tr>";
            return;
        }

        events.forEach(event => {
        tbody.innerHTML += `
            <tr>
                <td data-label="Date">${event.event_date}</td>
                <td data-label="Title">${event.title}</td>
                <td data-label="Description">${event.description}</td>
            </tr>
        `; 
        });


        
    })
    .catch(error => {
        console.error("Error loading events:", error);
        document.getElementById("events-table-body").innerHTML =
            "<tr><td colspan='4'>Error loading events</td></tr>";
    });
</script>

</body>
</html>
