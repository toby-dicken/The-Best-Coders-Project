<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLV Home</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, sans-serif;
  background:linear-gradient(-45deg, #00c6ff, #0072ff, #ff758c, #ff7eb3);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
  color:#333;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.navbar{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(0,0,0,0.65);
  color:#fff;
}

.nav-links{
  display:flex;
  gap:20px;
}

#searchInput{
  padding:6px;
  border-radius:6px;
  border:none;
}

.content-wrapper{
  padding:20px;
}

/* HORIZONTAL CARDS */
.cards{
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  gap:20px;
  padding-bottom:10px;
}

.card{
  min-width:220px;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  opacity:0;
  transform:translateY(20px);
  transition:0.4s;
  cursor:pointer;
  flex:0 0 auto;
}

.card.show{
  opacity:1;
  transform:translateY(0);
}

.card:hover{
  transform:translateY(-8px);
}
</style>
</head>

<body>

<!-- LANGUAGE -->
<div style="text-align:right; padding:10px;">
<select id="languageSelect" onchange="setLanguage(this.value)">
  <option value="en">English</option>
  <option value="de">Deutsch</option>
  <option value="fr">Français</option>
  <option value="hi">Hindi</option>
  <option value="ne">Nepali</option>
  <option value="ur">Urdu</option>
</select>
</div>

<!-- NAV -->
<nav class="navbar">
<div>WLV</div>

<div class="nav-links">
<a href="#" id="navHome"></a>
<a href="#" id="navCourses"></a>
<a href="#" id="navStudents"></a>
<a href="#" id="navClubs"></a>
<a href="#" id="navSupport"></a>
</div>

<input type="text" id="searchInput" onkeyup="searchCards()">
</nav>

<div class="content-wrapper">

<h1 id="welcome"></h1>
<p id="subtitle"></p>

<h2 id="servicesTitle"></h2>

<div class="cards">

<div class="card" onclick="location.href='courses(TD).html'">
<i class="material-icons">menu_book</i>
<h3 id="courseTitle"></h3>
<p id="courseDesc"></p>
</div>

<div class="card" onclick="location.href='students(MR).html'">
<i class="material-icons">people</i>
<h3 id="studentTitle"></h3>
<p id="studentDesc"></p>
</div>

<div class="card" onclick="location.href='library(MR).html'">
<i class="material-icons">library_books</i>
<h3 id="libraryTitle"></h3>
<p id="libraryDesc"></p>
</div>

<div class="card" onclick="location.href='events(TD).html'">
<i class="material-icons">sports_soccer</i>
<h3 id="clubsTitle"></h3>
<p id="clubsDesc"></p>
</div>

<div class="card" onclick="location.href='support(MR).html'">
<i class="material-icons">support_agent</i>
<h3 id="supportTitle"></h3>
<p id="supportDesc"></p>
</div>

</div>
</div>

<footer style="text-align:center; padding:20px; background:black; color:white;">
<p id="footerText"></p>
</footer>

<script>

const translations = {
  en:{
    navHome:"Home",navCourses:"Courses",navStudents:"Students",navClubs:"Events",navSupport:"Support",
    welcome:"Welcome to WLV",subtitle:"Explore services",servicesTitle:"Services",
    courseTitle:"Courses",courseDesc:"Academic courses",
    studentTitle:"Students",studentDesc:"Profiles",
    libraryTitle:"Library",libraryDesc:"Digital resources",
    clubsTitle:"Events",clubsDesc:"Join events",
    supportTitle:"Support",supportDesc:"24/7 help",
    searchInput:"Search...",footerText:"© 2026 WLV"
  },
  de:{
    navHome:"Start",navCourses:"Kurse",navStudents:"Studenten",navClubs:"Events",navSupport:"Support",
    welcome:"Willkommen bei WLV",subtitle:"Entdecke Dienste",servicesTitle:"Dienste",
    courseTitle:"Kurse",courseDesc:"Akademische Kurse",
    studentTitle:"Studenten",studentDesc:"Profile",
    libraryTitle:"Bibliothek",libraryDesc:"Digitale Ressourcen",
    clubsTitle:"Events",clubsDesc:"Teilnehmen",
    supportTitle:"Support",supportDesc:"24/7 Hilfe",
    searchInput:"Suchen...",footerText:"© 2026 WLV"
  },
  fr:{
    navHome:"Accueil",navCourses:"Cours",navStudents:"Étudiants",navClubs:"Événements",navSupport:"Support",
    welcome:"Bienvenue à WLV",subtitle:"Explorer les services",servicesTitle:"Services",
    courseTitle:"Cours",courseDesc:"Cours académiques",
    studentTitle:"Étudiants",studentDesc:"Profils",
    libraryTitle:"Bibliothèque",libraryDesc:"Ressources numériques",
    clubsTitle:"Événements",clubsDesc:"Participer",
    supportTitle:"Support",supportDesc:"Aide 24/7",
    searchInput:"Rechercher...",footerText:"© 2026 WLV"
  },
  hi:{
    navHome:"होम",navCourses:"कोर्स",navStudents:"छात्र",navClubs:"कार्यक्रम",navSupport:"सपोर्ट",
    welcome:"WLV में आपका स्वागत है",subtitle:"सेवाएँ देखें",servicesTitle:"सेवाएँ",
    courseTitle:"कोर्स",courseDesc:"शैक्षणिक कोर्स",
    studentTitle:"छात्र",studentDesc:"प्रोफाइल",
    libraryTitle:"लाइब्रेरी",libraryDesc:"डिजिटल संसाधन",
    clubsTitle:"कार्यक्रम",clubsDesc:"भाग लें",
    supportTitle:"सपोर्ट",supportDesc:"24/7 सहायता",
    searchInput:"खोजें...",footerText:"© 2026 WLV"
  },
  ne:{
    navHome:"घर",navCourses:"पाठ्यक्रम",navStudents:"विद्यार्थी",navClubs:"कार्यक्रम",navSupport:"समर्थन",
    welcome:"WLV मा स्वागत छ",subtitle:"सेवाहरू हेर्नुहोस्",servicesTitle:"सेवाहरू",
    courseTitle:"पाठ्यक्रम",courseDesc:"उच्च गुणस्तर",
    studentTitle:"विद्यार्थी",studentDesc:"प्रोफाइल",
    libraryTitle:"पुस्तकालय",libraryDesc:"डिजिटल स्रोत",
    clubsTitle:"कार्यक्रम",clubsDesc:"सहभागी हुनुहोस्",
    supportTitle:"समर्थन",supportDesc:"२४/७ सहायता",
    searchInput:"खोज्नुहोस्...",footerText:"© 2026 WLV"
  },
  ur:{
    navHome:"ہوم",navCourses:"کورسز",navStudents:"طلبہ",navClubs:"ایونٹس",navSupport:"سپورٹ",
    welcome:"WLV میں خوش آمدید",subtitle:"سروسز دیکھیں",servicesTitle:"سروسز",
    courseTitle:"کورسز",courseDesc:"تعلیمی کورسز",
    studentTitle:"طلبہ",studentDesc:"پروفائلز",
    libraryTitle:"لائبریری",libraryDesc:"ڈیجیٹل وسائل",
    clubsTitle:"ایونٹس",clubsDesc:"شرکت کریں",
    supportTitle:"سپورٹ",supportDesc:"24/7 مدد",
    searchInput:"تلاش کریں...",footerText:"© 2026 WLV"
  }
};

function applyLanguage(lang){
  const t = translations[lang];
  for(const id in t){
    const el = document.getElementById(id);
    if(el) el.innerText = t[id];
  }
  document.getElementById("searchInput").placeholder = t.searchInput;
}

function setLanguage(lang){
  localStorage.setItem("lang", lang);
  applyLanguage(lang);
}

function searchCards(){
  const input = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
  });
}

document.addEventListener("DOMContentLoaded", ()=>{
  const lang = localStorage.getItem("lang") || "en";
  document.getElementById("languageSelect").value = lang;
  applyLanguage(lang);

  document.querySelectorAll(".card").forEach((c,i)=>{
    setTimeout(()=>c.classList.add("show"), i*120);
  });
});

</script>
</body>
</html>
