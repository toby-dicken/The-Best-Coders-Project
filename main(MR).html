<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLV Home</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:linear-gradient(-45deg,#00c6ff,#0072ff,#ff758c,#ff7eb3);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
  color:#333;
}

@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* NAVBAR */
.navbar{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:rgba(0,0,0,0.7);
  color:white;
  flex-wrap:wrap;
}

.nav-links{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.nav-links a{
  color:white;
  text-decoration:none;
}

/* SEARCH */
#searchInput{
  padding:6px;
  border-radius:6px;
  border:none;
  outline:none;
}

/* LANGUAGE */
select{
  padding:5px;
  border-radius:6px;
}

/* CONTENT */
.content-wrapper{
  padding:20px;
}

/* HORIZONTAL CARDS */
.cards{
  display:flex;
  overflow-x:auto;
  gap:20px;
  padding-bottom:10px;
}

.card{
  min-width:220px;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  cursor:pointer;
  opacity:0;
  transform:translateY(20px);
  transition:0.4s;
  flex:0 0 auto;
}

.card.show{
  opacity:1;
  transform:translateY(0);
}

.card:hover{
  transform:translateY(-8px);
}

</style>
</head>

<body>

<!-- LANGUAGE -->
<div style="text-align:right;padding:10px;">
<select id="languageSelect" onchange="setLanguage(this.value)">
  <option value="en">English</option>
  <option value="de">Deutsch</option>
  <option value="fr">Français</option>
  <option value="hi">Hindi</option>
  <option value="ne">Nepali</option>
  <option value="ur">Urdu</option>
</select>
</div>

<!-- NAVBAR -->
<nav class="navbar">
<div><b>WLV</b></div>

<div class="nav-links">
<a href="#" id="navHome"></a>
<a href="#" id="navCourses"></a>
<a href="#" id="navStudents"></a>
<a href="#" id="navClubs"></a>
<a href="#" id="navSupport"></a>
</div>

<input type="text" id="searchInput" placeholder="" onkeyup="searchCards()">
</nav>

<div class="content-wrapper">

<h1 id="welcome"></h1>
<p id="subtitle"></p>

<h2 id="servicesTitle"></h2>

<div class="cards">

<div class="card" onclick="location.href='courses(aarimrana).html'">
<i class="material-icons">menu_book</i>
<h3 id="courseTitle"></h3>
<p id="courseDesc"></p>
</div>

<div class="card" onclick="location.href='students(MR).html'">
<i class="material-icons">people</i>
<h3 id="studentTitle"></h3>
<p id="studentDesc"></p>
</div>

<div class="card" onclick="location.href='library(MR).html'">
<i class="material-icons">library_books</i>
<h3 id="libraryTitle"></h3>
<p id="libraryDesc"></p>
</div>

<div class="card" onclick="location.href='events(TD).html'">
<i class="material-icons">sports_soccer</i>
<h3 id="clubsTitle"></h3>
<p id="clubsDesc"></p>
</div>

<div class="card" onclick="location.href='support(MR).html'">
<i class="material-icons">support_agent</i>
<h3 id="supportTitle"></h3>
<p id="supportDesc"></p>
</div>

</div>
</div>

<script>

const translations = {
en:{
navHome:"Home",navCourses:"Courses",navStudents:"Students",navClubs:"Events",navSupport:"Support",
welcome:"Welcome to WLV",subtitle:"Explore services",servicesTitle:"Services",
courseTitle:"Courses",courseDesc:"Academic courses",
studentTitle:"Students",studentDesc:"Profiles",
libraryTitle:"Library",libraryDesc:"Digital resources",
clubsTitle:"Events",clubsDesc:"Join events",
supportTitle:"Support",supportDesc:"24/7 help",
searchInput:"Search..."
},
de:{
navHome:"Start",navCourses:"Kurse",navStudents:"Studenten",navClubs:"Events",navSupport:"Support",
welcome:"Willkommen",subtitle:"Dienste erkunden",servicesTitle:"Dienste",
courseTitle:"Kurse",courseDesc:"Akademische Kurse",
studentTitle:"Studenten",studentDesc:"Profile",
libraryTitle:"Bibliothek",libraryDesc:"Ressourcen",
clubsTitle:"Events",clubsDesc:"Teilnehmen",
supportTitle:"Support",supportDesc:"Hilfe",
searchInput:"Suchen..."
},
fr:{
navHome:"Accueil",navCourses:"Cours",navStudents:"Étudiants",navClubs:"Événements",navSupport:"Support",
welcome:"Bienvenue",subtitle:"Explorer",servicesTitle:"Services",
courseTitle:"Cours",courseDesc:"Cours académiques",
studentTitle:"Étudiants",studentDesc:"Profils",
libraryTitle:"Bibliothèque",libraryDesc:"Ressources",
clubsTitle:"Événements",clubsDesc:"Participer",
supportTitle:"Support",supportDesc:"Aide",
searchInput:"Rechercher..."
},
hi:{
navHome:"होम",navCourses:"कोर्स",navStudents:"छात्र",navClubs:"कार्यक्रम",navSupport:"सपोर्ट",
welcome:"स्वागत है",subtitle:"सेवाएँ देखें",servicesTitle:"सेवाएँ",
courseTitle:"कोर्स",courseDesc:"शैक्षणिक कोर्स",
studentTitle:"छात्र",studentDesc:"प्रोफाइल",
libraryTitle:"लाइब्रेरी",libraryDesc:"संसाधन",
clubsTitle:"कार्यक्रम",clubsDesc:"भाग लें",
supportTitle:"सपोर्ट",supportDesc:"मदद",
searchInput:"खोजें..."
},
ne:{
navHome:"घर",navCourses:"पाठ्यक्रम",navStudents:"विद्यार्थी",navClubs:"कार्यक्रम",navSupport:"समर्थन",
welcome:"स्वागत छ",subtitle:"सेवाहरू",servicesTitle:"सेवाहरू",
courseTitle:"पाठ्यक्रम",courseDesc:"उच्च गुणस्तर",
studentTitle:"विद्यार्थी",studentDesc:"प्रोफाइल",
libraryTitle:"पुस्तकालय",libraryDesc:"डिजिटल",
clubsTitle:"कार्यक्रम",clubsDesc:"सहभागी",
supportTitle:"समर्थन",supportDesc:"२४/७ सहायता",
searchInput:"खोज्नुहोस्..."
},
ur:{
navHome:"ہوم",navCourses:"کورسز",navStudents:"طلبہ",navClubs:"ایونٹس",navSupport:"سپورٹ",
welcome:"خوش آمدید",subtitle:"خدمات دیکھیں",servicesTitle:"خدمات",
courseTitle:"کورسز",courseDesc:"تعلیمی",
studentTitle:"طلبہ",studentDesc:"پروفائل",
libraryTitle:"لائبریری",libraryDesc:"وسائل",
clubsTitle:"ایونٹس",clubsDesc:"شرکت",
supportTitle:"سپورٹ",supportDesc:"مدد",
searchInput:"تلاش..."
}
};

function applyLanguage(lang){
  const t = translations[lang];

  document.getElementById("welcome").innerText = t.welcome;
  document.getElementById("subtitle").innerText = t.subtitle;
  document.getElementById("servicesTitle").innerText = t.servicesTitle;

  document.getElementById("courseTitle").innerText = t.courseTitle;
  document.getElementById("courseDesc").innerText = t.courseDesc;

  document.getElementById("studentTitle").innerText = t.studentTitle;
  document.getElementById("studentDesc").innerText = t.studentDesc;

  document.getElementById("libraryTitle").innerText = t.libraryTitle;
  document.getElementById("libraryDesc").innerText = t.libraryDesc;

  document.getElementById("clubsTitle").innerText = t.clubsTitle;
  document.getElementById("clubsDesc").innerText = t.clubsDesc;

  document.getElementById("supportTitle").innerText = t.supportTitle;
  document.getElementById("supportDesc").innerText = t.supportDesc;

  document.getElementById("searchInput").placeholder = t.searchInput;

  localStorage.setItem("lang", lang);
}

function setLanguage(lang){
  applyLanguage(lang);
}

function searchCards(){
  let input = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    card.style.display = card.innerText.toLowerCase().includes(input) ? "flex" : "none";
  });
}

window.onload = function(){
  let lang = localStorage.getItem("lang") || "en";
  document.getElementById("languageSelect").value = lang;
  applyLanguage(lang);

  document.querySelectorAll(".card").forEach((c,i)=>{
    setTimeout(()=>c.classList.add("show"), i*120);
  });
};

</script>

</body>
</html>
